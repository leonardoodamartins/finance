<script>
(()=>{'use strict';
const key='junto-theme';
const system=window.matchMedia('(prefers-color-scheme: dark)');
let explicit=null;
try{const saved=localStorage.getItem(key);if(saved==='light'||saved==='dark')explicit=saved}catch(e){}
function apply(theme){
 document.documentElement.dataset.theme=theme;
 document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#092b1c':'#edf2ee';
 const button=document.getElementById('theme-toggle');
 if(button){button.setAttribute('aria-checked',String(theme==='dark'));button.title=theme==='dark'?'Ativar tema claro':'Ativar tema escuro';button.querySelector('span').textContent=theme==='dark'?'Escuro':'Claro'}
}
apply(explicit||(system.matches?'dark':'light'));
document.addEventListener('DOMContentLoaded',()=>{
 apply(document.documentElement.dataset.theme);
 document.getElementById('theme-toggle').addEventListener('click',()=>{
  explicit=document.documentElement.dataset.theme==='dark'?'light':'dark';apply(explicit);
  try{localStorage.setItem(key,explicit)}catch(e){const toast=document.getElementById('toast');toast.textContent='Tema alterado. Não foi possível salvar a escolha neste navegador.';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),4000)}
 });
});
system.addEventListener('change',()=>{if(!explicit)apply(system.matches?'dark':'light')});
window.addEventListener('storage',e=>{if(e.key===key||e.key===null){explicit=e.newValue==='light'||e.newValue==='dark'?e.newValue:null;apply(explicit||(system.matches?'dark':'light'))}});
})();
</script>

(()=>{'use strict';
const STORE_KEY='junto-financas-v1';
const PROFILE_KEY='junto-entry-profile';let entryProfile='a';try{const saved=localStorage.getItem(PROFILE_KEY);if(['a','b'].includes(saved))entryProfile=saved}catch(e){}
const CAT={moradia:{name:'Moradia',icon:'⌂',color:'#92ff5f'},mercado:{name:'Mercado',icon:'▤',color:'#ff7036'},carro:{name:'Carro',icon:'▣',color:'#bff2f0'},saude:{name:'Saúde',icon:'✚',color:'#cff1d2'},educacao:{name:'Educação',icon:'✦',color:'#0f3b27'},alimentacao:{name:'Alimentação',icon:'♨',color:'#6da884'},transporte:{name:'Transporte',icon:'↗',color:'#ff7036'},contas:{name:'Contas e serviços',icon:'ϟ',color:'#92ff5f'},lazer:{name:'Lazer',icon:'✳',color:'#cff1d2'},compras:{name:'Compras',icon:'◇',color:'#bff2f0'},pets:{name:'Pets',icon:'♡',color:'#6da884'},outros:{name:'Outros',icon:'••',color:'#7f9c8c'}};
const ICONS={home:'home',percent:'chart',equal:'repeat',transactions:'list',settings:'settings'};
const NAV=[['home','Visão geral'],['percent','Percentual'],['equal','50/50'],['transactions','Movimentos'],['settings','Ajustes']];
const FMT=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateFromIso=s=>new Date(`${s}T12:00:00`);
const makeId=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():`j${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`;
const blank=()=>({version:1,people:[{id:'a',name:'Leonardo',incomeCents:0},{id:'b',name:'Georgia',incomeCents:0}],defaultSplit:'custom',percentA:60,monthlyBudgetCents:0,personalBudgetCents:0,transactions:[]});
const money=c=>FMT.format((Number(c)||0)/100);
const numeric=c=>(Math.round(Number(c)||0)/100).toFixed(2).replace('.',',');
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

const validMoney=x=>Number.isSafeInteger(x)&&x>=0&&x<=100000000000;
const parseMoney=v=>{let x=String(v||'').replace(/\s|R\$/gi,'').trim();if(!x)return NaN;if(x.includes(','))x=x.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(x))x=x.replace(/\./g,'');if(!/^\d+(?:\.\d{1,2})?$/.test(x))return NaN;return Math.round(Number(x)*100)};
const monthShift=(ym,n)=>{const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
const dateInMonth=(ym,day)=>{const [y,m]=ym.split('-').map(Number);const last=new Date(y,m,0).getDate();return `${ym}-${String(Math.min(day,last)).padStart(2,'0')}`};
const monthName=ym=>{const [y,m]=ym.split('-').map(Number);return `${new Intl.DateTimeFormat('pt-BR',{month:'short'}).format(new Date(y,m-1,1)).replace('.','')} ${y}`};
const dateShort=s=>new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short'}).format(dateFromIso(s)).replace('.','');
const sameMonth=(t,ym)=>t.date&&t.date.startsWith(ym);
function validateLoaded(raw){
 if(!raw||raw.version!==1||!Array.isArray(raw.people)||raw.people.length!==2||!Array.isArray(raw.transactions)||raw.transactions.length>150000)throw Error('Formato de dados inválido');
 const people=['a','b'].map((id,i)=>{const p=raw.people.find(p=>p?.id===id);if(!p||typeof p.name!=='string'||p.name.length>70||!validMoney(p.incomeCents))throw Error('Participantes inválidos');return {id,name:p.name.slice(0,40)||`Pessoa ${i+1}`,incomeCents:p.incomeCents}});
 const tx=raw.transactions.map(e=>{
  if(!e||!['expense','income','settlement'].includes(e.type)||typeof e.id!=='string'||e.id.length>100||!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||!Number.isSafeInteger(e.amountCents)||e.amountCents<=0||e.amountCents>100000000000)throw Error('Lançamentos inválidos');
  const x={id:e.id,type:e.type,date:e.date,amountCents:e.amountCents,description:String(e.description||'').slice(0,140),createdAt:Number(e.createdAt)||0};
  if(e.type==='expense'){
   if(!['a','b'].includes(e.payer)||!['shared','personal'].includes(e.scope)||!CAT[e.category])throw Error('Despesas inválidas');
   x.payer=e.payer;x.scope=e.scope;x.category=e.category;
   x.split=['equal','income','custom'].includes(e.split)?e.split:'equal';x.percentage=Math.max(0,Math.min(100,Number(e.percentage)||0));
   x.pool=x.scope==='shared'?(['percent','equal'].includes(e.pool)?e.pool:(e.split==='equal'?'equal':'percent')):'personal';
   if(!e.shares||!validMoney(e.shares.a)||!validMoney(e.shares.b)||e.shares.a+e.shares.b!==e.amountCents)throw Error('Divisões inválidas');
   x.shares={a:e.shares.a,b:e.shares.b};
  }
  if(e.type==='income'){if(!['a','b'].includes(e.member))throw Error('Receitas inválidas');x.member=e.member;x.category=['salario','extra'].includes(e.category)?e.category:'extra'}
  if(e.type==='settlement'){if(!['a','b'].includes(e.from)||!['a','b'].includes(e.to)||e.from===e.to)throw Error('Acertos inválidos');x.from=e.from;x.to=e.to;x.pool=['percent','equal'].includes(e.pool)?e.pool:'percent'}
  return x;

function renderReports(){const st=monthlyStats(),mine=myMonth(),cats=catTotals(st.expenses);const months=[-5,-4,-3,-2,-1,0].map(n=>monthShift(selectedMonth,n));const monthly=months.map(m=>({month:m,...monthlyStats(m)}));const max=Math.max(1,...monthly.map(v=>v.total));const personA=st.expenses.reduce((s,t)=>s+(t.scope==='shared'?t.shares.a:(t.payer==='a'?t.amountCents:0)),0);const personB=st.total-personA;const sharedPct=st.total?Math.round(st.shared/st.total*100):0;return `<div class="view">${pageHead('PERSPECTIVA','Análises','Entenda os padrões das suas finanças.')}<div class="report-grid">${statCard('Total lançado',st.total,'Todos os gastos das duas pessoas','report-big')}${statCard('Meu custo',mine.cost,'O que cabe a você')}${statCard('Casal',st.shared,sharedPct+'% do total')}</div><section class="section"><div class="panel"><div class="panel-head"><div><h3>Evolução dos gastos</h3><p class="panel-sub">Últimos 6 meses até o período selecionado</p></div><span class="mini-label">${money(max)} máx.</span></div><div class="bars" role="img" aria-label="Gráfico de despesas por mês">${monthly.map(x=>`<div class="bar-column" title="${escapeHtml(monthName(x.month))}: ${money(x.total)}"><div class="bar-track"><div class="bar-block personal" style="height:${(x.personal/max*100).toFixed(2)}%"></div><div class="bar-block shared" style="height:${(x.shared/max*100).toFixed(2)}%"></div></div><span class="bar-label">${escapeHtml(monthName(x.month).split(' ')[0])}</span></div>`).join('')}</div><div style="display:flex;gap:17px;margin-top:14px;font-size:11px;color:#748276"><span><span class="color-dot" style="background:#8aab64"></span> Compartilhado</span><span><span class="color-dot" style="background:#cdddb8"></span> Pessoal</span></div></div></section><section class="section"><div class="insight-grid"><div class="panel"><div class="panel-head"><div><h3>Quem ficou com quanto?</h3><p class="panel-sub">Participação nos gastos do mês</p></div></div><div class="split-bar"><span style="width:${st.total?personA/st.total*100:50}%"></span><span style="width:${st.total?personB/st.total*100:50}%"></span></div><div class="split-legend"><div><small>${escapeHtml(nameOf('a'))}</small><b>${money(personA)}</b></div><div style="text-align:right"><small>${escapeHtml(nameOf('b'))}</small><b>${money(personB)}</b></div></div></div><div class="panel"><div class="panel-head"><div><h3>Receitas registradas</h3><p class="panel-sub">Valores recebidos no mês</p></div></div>${data.people.map(p=>`<div style="display:flex;justify-content:space-between;gap:9px;margin-bottom:17px;font-size:12px"><span style="color:#718273">${escapeHtml(p.name)}</span><b>${money(st.incomes.filter(t=>t.member===p.id).reduce((s,t)=>s+t.amountCents,0))}</b></div>`).join('')}<p style="font-size:10px;color:#9ba79c;line-height:1.5;margin:4px 0 0">As rendas de referência não são lançadas automaticamente como receitas.</p></div></div></section><section class="section"><div class="panel"><div class="panel-head"><div><h3>Gastos por categoria</h3><p class="panel-sub">Do maior para o menor</p></div></div>${cats.length?cats.map(x=>`<div class="category-line"><div class="category-head"><b>${escapeHtml(x.name)}</b><span>${money(x.total)} · ${Math.round(x.total/st.total*100)}%</span></div><div class="category-bar"><span style="background:${x.color};width:${Math.max(2,x.total/st.total*100)}%"></span></div></div>`).join(''):`<p class="form-intro" style="margin:0">Nenhuma despesa registrada neste período.</p>`}</div></section></div>`}
function renderSettings(){return `<div class="view">${pageHead('PREFERÊNCIAS','Ajustes','Dois perfis para identificar os lançamentos, sem conta ou senha.',false)}<form id="settings-form" class="form-card"><h3>Participantes</h3><p class="form-intro">Perfis sem login. Escolha a pessoa ao cadastrar uma despesa, receita ou acerto. Os nomes podem ser alterados aqui.</p><div class="form-grid"><div class="field"><label for="name-a">Nome do primeiro perfil</label><input id="name-a" name="nameA" maxlength="40" required value="${escapeHtml(nameOf('a'))}"></div><div class="field"><label for="name-b">Nome do segundo perfil</label><input id="name-b" name="nameB" maxlength="40" required value="${escapeHtml(nameOf('b'))}"></div><div class="field full"><label for="settings-percent">Sua parte padrão no painel percentual (%)</label><input id="settings-percent" name="percentA" type="number" min="0" max="100" step="0.1" inputmode="decimal" value="${data.percentA}" required><small>A porcentagem restante será atribuída à outra pessoa. Novos lançamentos usarão este valor.</small></div><div class="field"><label for="income-a">Sua renda de referência (R$)</label><input id="income-a" name="incomeA" inputmode="decimal" value="${numeric(data.people[0].incomeCents)}" placeholder="0,00"></div><div class="field"><label for="income-b">Renda da outra pessoa (R$)</label><input id="income-b" name="incomeB" inputmode="decimal" value="${numeric(data.people[1].incomeCents)}" placeholder="0,00"></div><div class="field full"><label for="personal-budget">Limite mensal pessoal (R$)</label><input id="personal-budget" name="personalBudget" inputmode="decimal" value="${numeric(data.personalBudgetCents)}" placeholder="0,00"></div><div class="field full"><label for="budget">Limite mensal das despesas compartilhadas (R$)</label><input id="budget" name="budget" inputmode="decimal" value="${numeric(data.monthlyBudgetCents)}" placeholder="0,00"></div></div><div class="soft-panel" style="margin:18px 0"><p><strong>Sep let chartObserver=null;
function animateCharts(){
 if(chartObserver){chartObserver.disconnect();chartObserver=null}
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches||!('IntersectionObserver' in window))return;
 chartObserver=new IntersectionObserver(entries=>{for(const entry of entries){if(entry.isIntersecting){entry.target.classList.add('motion-enter');chartObserver.unobserve(entry.target)}}},{threshold:.15});
 document.querySelectorAll('#main-content .graphic-card,#main-content .category-bar').forEach(el=>chartObserver.observe(el));
}

async function optimizeReceipt(file){const original=URL.createObjectURL(file);try{const img=new Image();img.src=original;await img.decode();const maxDim=1750,ratio=Math.min(1,maxDim/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*ratio),h=Math.round(img.naturalHeight*ratio);if(!w||!h)throw Error('Imagem incompatível');const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d',{alpha:false}).drawImage(img,0,0,w,h);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.88));if(!blob)throw Error('Falha ao preparar foto');URL.revokeObjectURL(original);return URL.createObjectURL(blob);}catch(e){console.warn('Usando imagem original',e);return original;}}
function extractReceipt(text){const lines=String(text||'').split(/[\r\n]+/).map(x=>x.trim()).filter(Boolean);const currencyRe=/(?:R\$\s*)?\d{1,6}(?:[.\s]\d{3})*,\d{2}\b|(?:R\$\s*)?\d{1,6}\.\d{2}\b/g;const candidates=[];

 const plain=lines.join(' ').toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 const categories=[['saude',/farmac|drogaria|clinica|hospital|consulta|medicamento|medico|dentista|laboratorio|plano de saude/],['mercado',/supermerc|mercado|atacad|hortifrut|mercearia|hipermerc|carrefour|pao de acucar|assai atacad|big bom|zafari|rissul/],['educacao',/escola|livraria|faculdade|universidade|curso|educa|mensalidade|colegio|aula/],['carro',/combust|gasolina|etanol|posto |auto pec|oficina|mecanica|estacionam|lavajato|pedagio|ipva|seguro autom/],['pets',/petshop|pet shop|veterin|racao|animal|petz|cobasi/],['moradia',/aluguel|condominio|reforma|material de construc|imovel/],['transporte',/uber|99app|passagem|bilhete|metro|onibus|taxi|rodoviaria/],['alimentacao',/restaurante|lanchonete|pizzaria|cafeteria|padaria|delivery|ifood|lanche|comida/],['contas',/energia eletrica|conta de luz|internet|telefon|saneamento|agua e esgoto|energia|celular/],['lazer',/cinema|teatro|show|ingresso|viagem|hotel|parque/],['compras',/vestuario|roupas|calcados|loja de depart|shopping/]];

document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){changeView(nav.dataset.nav);return}const act=e.target.closest('[data-action]');if(act){handleAction(act);return}if(e.target.id==='modal-backdrop')closeModal()});
document.addEventListener('submit',e=>{if(e.target.id==='entry-form'){e.preventDefault();submitEntry(e.target)}else if(e.target.id==='settings-form'){e.preventDefault();saveSettings(e.target)}else if(e.target.id==='percent-form'){e.preventDefault();const p=Number(e.target.elements.percentA.value);if(!Number.isFinite(p)||p<0||p>100){notify('Informe uma porcentagem entre 0 e 100');return}data.percentA=p;const saved=store();render();notify(saved?'Porcentagem padrão atualizada':'Não foi possível salvar')}});
document.addEventListener('input',e=>{if(e.target.id==='tx-search'){txSearch=e.target.value;const list=document.getElementById('transaction-list');if(list)list.innerHTML=movementList();const count=document.getElementById('tx-count');if(count)count.textContent=`${filterEntries().length} lançamentos`;}if(e.target.id==='percent-a'){const p=Number(e.target.value),el=document.getElementById('pct-description');if(el&&Number.isFinite(p))el.textContent=`${nameOf('a')}: ${p.toLocaleString('pt-BR')}% · ${nameOf('b')}: ${(100-p).toLocaleString('pt-BR')}%`;}if(e.target.closest('#entry-form'))syncEntryForm()});
document.addEventListener('change',e=>{if(e.target.closest('#entry-form'))syncEntryForm()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.modal-backdrop'))closeModal()});
['scan-camera','scan-library'].forEach(id=>document.getElementById(id).addEventListener('change',e=>{const file=e.target.files?.[0];e.target.value='';if(file)handleScanFile(file)}));
document.getElementById('import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const content=await file.text();const incoming=validateLoaded(JSON.parse(content));if(!confirm(`Importar ${incoming.transactions.length} lançamentos? Os dados atuais serão substituídos.`))return;data=incoming;const persisted=store();view='home';selectedMonth=today().slice(0,7);Object.keys(monthsByView).forEach(k=>monthsByView[k]=selectedMonth);render();notify(persisted?'Backup importado com sucesso':'Importação não salva neste dispositivo')}catch(err){console.error(err);notify('Arquivo inválido ou incompatível')}finally{e.target.value=''}});
render();
})();
</script>
</body>
</html>
